services:
  - type: web
    name: muse-intelligence
    runtime: docker
    rootDir: apps/intelligence
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MUSE_CORS_ORIGINS
        sync: false
      - key: MUSE_DATABASE_PATH
        value: /var/data/muse.sqlite3
    disk:
      name: muse-data
      mountPath: /var/data
      sizeGB: 1
